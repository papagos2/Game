<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Beaconhold Engine Buffers</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2a1f; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
// Renders the exact buffers the Unreal layer uploads (see Tools/SimTests/export/ExportRender.cpp):
// one unlit palette material for all opaque geometry and translucent blob shadows. No lights and
// no tone mapping, as in the engine, so this shows the shipped look.
import * as THREE from './node_modules/three/build/three.module.js';

const DEG = Math.PI / 180;
function rotRows(pitch, yaw, roll) {
  const SP = Math.sin(pitch * DEG), CP = Math.cos(pitch * DEG);
  const SY = Math.sin(yaw * DEG), CY = Math.cos(yaw * DEG);
  const SR = Math.sin(roll * DEG), CR = Math.cos(roll * DEG);
  return [
    [CP * CY, CP * SY, SP],
    [SR * SP * CY - CR * SY, SR * SP * SY + CR * CY, -SR * CP],
    [-(CR * SP * CY + SR * SY), CY * SR - CR * SP * SY, CR * CP],
  ];
}
// Unreal (X, Y, Z) centimetres -> three (x, y, z) metres with y up.
function ueToThree(v) { return new THREE.Vector3(v[0], v[2], v[1]); }

async function bin(url) { return (await fetch(url)).arrayBuffer(); }

function geometry(buf, verts, indices) {
  const f = new Float32Array(buf, 0, verts * 5);
  const pos = new Float32Array(verts * 3);
  const uv = new Float32Array(verts * 2);
  for (let i = 0; i < verts; i++) {
    pos[i * 3] = f[i * 5] / 100;
    pos[i * 3 + 1] = f[i * 5 + 2] / 100;
    pos[i * 3 + 2] = f[i * 5 + 1] / 100;
    uv[i * 2] = f[i * 5 + 3];
    uv[i * 2 + 1] = f[i * 5 + 4];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(buf, verts * 20, indices), 1));
  return g;
}

function texture(buf, w, h, nearest) {
  const t = new THREE.DataTexture(new Uint8Array(buf), w, h, THREE.RGBAFormat);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = t.minFilter = nearest ? THREE.NearestFilter : THREE.LinearFilter;
  t.generateMipmaps = false;
  t.flipY = false;
  t.needsUpdate = true;
  return t;
}

async function main() {
  const params = new URLSearchParams(location.search);
  const dir = params.get('dir');
  const hdr = await (await fetch(dir + '/render.json')).json();
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.NoToneMapping;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1d2a1f);

  const palette = texture(await bin(dir + '/palette.rgba'), hdr.paletteW, hdr.paletteH, true);
  const shadowTex = texture(await bin(dir + '/shadow.rgba'), hdr.shadowSize, hdr.shadowSize, false);
  // The engine culls back faces; here both sides render because the axis swap mirrors winding.
  const opaque = new THREE.Mesh(geometry(await bin(dir + '/opaque.bin'), hdr.opaqueVerts, hdr.opaqueIndices),
    new THREE.MeshBasicMaterial({ map: palette, side: THREE.DoubleSide }));
  const shadow = new THREE.Mesh(geometry(await bin(dir + '/shadow.bin'), hdr.shadowVerts, hdr.shadowIndices),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  shadow.renderOrder = 1;
  scene.add(opaque, shadow);

  const cam = hdr.camera;
  const fwd = rotRows(-cam.pitch, cam.yaw, 0)[0];
  const camPos = [cam.fx - fwd[0] * cam.dist, cam.fy - fwd[1] * cam.dist, -fwd[2] * cam.dist];
  const vfov = 2 * Math.atan(Math.tan(cam.fov * DEG / 2) / (16 / 9)) / DEG;
  const camera = new THREE.PerspectiveCamera(vfov, window.innerWidth / window.innerHeight, 0.5, 300);
  camera.position.copy(ueToThree(camPos));
  camera.up.set(0, 1, 0);
  camera.lookAt(new THREE.Vector3(cam.fx, 0, cam.fy));
  renderer.render(scene, camera);
  document.title = 'ready';
}
main().catch(e => { document.title = 'error: ' + e.message; console.error(e); });
</script>
</body>
</html>
