[/Script/UnrealEd.ProjectPackagingSettings]
; The only map is the engine's empty Entry map; the game builds everything at runtime.
+MapsToCook=(FilePath="/Engine/Maps/Entry")
; Engine materials loaded by path at runtime (the widget pass-through materials the palette and
; decals use). Cooking the whole folder is the dependable way to include them; it costs some
; package size. Once a packaged build is confirmed, this can be narrowed (see README).
+DirectoriesToAlwaysCook=(Path="/Engine/EngineMaterials")
UsePakFile=True
bUseIoStore=True
bShareMaterialShaderCode=True
IncludeDebugFiles=False

[/Script/Beaconhold.BhSettings]
