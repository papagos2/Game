; Beaconhold engine configuration.
; The game is code-only: it runs in the engine's empty Entry map and builds its world, meshes,
; textures, sounds and UI at runtime, so no .uasset content is required.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/Beaconhold.BhGameMode
GameInstanceClass=/Script/Beaconhold.BhGameInstance

[/Script/Engine.RendererSettings]
; Everything is drawn with unlit materials and baked lighting (see Sim/BhRender.h), so the
; expensive lighting features are switched off. Mobile renders in LDR: no tone mapping, which
; keeps the palette colours exact and saves bandwidth on phones.
r.MobileHDR=False
r.Mobile.AntiAliasing=3
r.MSAACount=4
r.AntiAliasingMethod=1
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.AllowStaticLighting=False
r.RayTracing=False
r.Nanite.ProjectEnabled=False
r.SkinCache.CompileShaders=False
r.Mobile.EnableStaticAndCSMShadowReceivers=False
r.Mobile.AllowDistanceFieldShadows=False
r.MobileNumDynamicPointLights=0

[/Script/Engine.LocalPlayer]
; The camera keeps a constant vertical view; the horizontal field of view is computed per frame
; from the screen's aspect ratio (phones are 19.5:9 to 21:9, tablets 4:3).
AspectRatioAxisConstraint=AspectRatio_MaintainXFOV

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Change PackageName to your own reverse-domain id before publishing (com.example is rejected
; by Google Play on purpose).
PackageName=com.example.beaconhold
ApplicationDisplayName=Beaconhold
StoreVersion=1
VersionDisplayName=0.1.0
Orientation=SensorLandscape
bFullScreen=True
bUseDisplayCutout=True
bPackageDataInsideApk=True
bSupportsVulkan=True
bBuildForES31=True
bBuildForArm64=True
bBuildForX8664=False
bEnableGooglePlaySupport=False
bShowLaunchImage=False

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; Change BundleIdentifier to your own id (it must match your Apple provisioning profile).
BundleDisplayName=Beaconhold
BundleName=beaconhold
BundleIdentifier=com.example.beaconhold
VersionInfo=0.1.0
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
PreferredLandscapeOrientation=LandscapeLeft
bSupportsMetal=True
bSupportsMetalMRT=False
FrameRateLock=PUFRL_60
bEnableGameCenterSupport=False
bEnableCloudKitSupport=False
bEnableRemoteNotificationsSupport=False
